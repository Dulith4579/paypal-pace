      <stop offset="0" stop-color="#4B5563"/>
      <stop offset="1" stop-color="#1F2937"/>
    </linearGradient>
  </defs>
  <ellipse cx="800" cy="920" rx="420" ry="26" fill="#000" opacity="0.08"/>
